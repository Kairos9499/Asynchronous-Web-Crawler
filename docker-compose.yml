name: webcrawler

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crawler}
      POSTGRES_DB: crawler
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт БД наружу не публикуется: доступ только из сети compose.
    # Для отладки раскомментируйте:
    # ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawler -d crawler"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  server:
    build: .
    image: webcrawler:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://crawler:${POSTGRES_PASSWORD:-crawler}@db:5432/crawler?sslmode=disable
      HTTP_ADDR: ":8080"
      WORKERS: ${WORKERS:-4}
      QUEUE_SIZE: ${QUEUE_SIZE:-100}
      CRAWL_DELAY: ${CRAWL_DELAY:-200ms}
      JOB_TIMEOUT: ${JOB_TIMEOUT:-10m}
      ALLOW_PRIVATE_HOSTS: ${ALLOW_PRIVATE_HOSTS:-false}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # CLI-клиент: docker compose run --rm client <команда>
  client:
    build: .
    image: webcrawler:latest
    profiles: ["tools"]
    entrypoint: ["client"]
    environment:
      CRAWLER_URL: http://server:8080
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
